# docker-compose.yml
# Levanta PostgreSQL + Backend + Frontend para desarrollo local.
# Uso: docker compose up -d          # Inicia todos los servicios
#      docker compose up -d --build  # Reconstruye imágenes y levanta
#      docker compose down           # Detiene y elimina contenedores
#      docker compose down -v        # Detiene, elimina contenedores y volúmenes
#      docker compose logs -f        # Ver logs en tiempo real

services:
  postgres:
    # Imagen oficial de PostgreSQL, versión 16 (estable y ampliamente usada)
    image: postgres:16

    # Nombre amigable para el contenedor
    container_name: ecommerce-postgres

    # Carga las variables de entorno desde .env.docker
    env_file:
      - .env.docker

    # Puerto: host:contenedor
    # Mapea 5432 del host al 5432 del contenedor.
    # Así herramientas externas (pgAdmin, backend local) se conectan sin cambios.
    ports:
      - "5432:5432"

    # Volumen nombrado para persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Health check para verificar que PostgreSQL está listo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: ecommerce-backend
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: nodemon src/server.js
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    environment:
      # El browser accede al backend desde el host en localhost:3000
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # --host 0.0.0.0 permite conexiones desde el host hacia el contenedor
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
